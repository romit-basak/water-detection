[project]
name = "sarsim"
version = "0.1.0"
description = "GPU-accelerated SAR phase-history simulator (reimplementation of Willis et al. 2020, arXiv:2005.09736)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "mitsuba==3.6.*",
]

[project.scripts]
sarsim = "sarsim.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarsim"]
